name: Smoke and Verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-and-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-local-smoke:
    name: Build and local smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and smoke local app
        run: npm run verify:ci

  vercel-deployment-verification:
    name: Vercel deployment verification
    runs-on: ubuntu-latest
    needs: build-and-local-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      statuses: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Wait for Vercel deployment status
        run: node scripts/verify-vercel-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VERCEL_STATUS_CONTEXT: Vercel
          VERCEL_STATUS_RETRIES: 40
          VERCEL_STATUS_INTERVAL_MS: 15000

      - name: Smoke deployed branch alias
        run: node scripts/smoke-url.mjs
        env:
          SMOKE_URL: https://thedrinkingcog-git-main-theblucogs-projects.vercel.app
          SMOKE_REQUIRED_TEXT: The Drinking Cog
          SMOKE_REQUIRED_MARKER: home-ready
          SMOKE_RETRIES: 20
          SMOKE_INTERVAL_MS: 3000
